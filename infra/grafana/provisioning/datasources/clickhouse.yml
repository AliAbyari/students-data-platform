apiVersion: 1

datasources:
  - name: ClickHouse DW
    uid: clickhouse-dw
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: ${CH_USER}
      defaultDatabase: ${CH_DATABASE}
    secureJsonData:
      password: ${CH_PASSWORD}
