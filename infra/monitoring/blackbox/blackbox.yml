modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4

  airflow_scheduler:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"scheduler":\s*\{[^}]*"status":\s*"healthy"'

  connector_running:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"connector":\s*\{"state":\s*"RUNNING"'
      fail_if_body_matches_regexp:
        - '"state":\s*"(FAILED|PAUSED|UNASSIGNED)"'
