global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels: { instance: docker-host }

  - job_name: docker
    static_configs:
      - targets: [docker-exporter:9417]
        labels: { instance: docker-host }

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
        labels: { instance: kafka }

  - job_name: clickhouse
    static_configs:
      - targets: [clickhouse:9363]
        labels: { instance: clickhouse }

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels: { instance: postgres }

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]

  - job_name: probe
    metrics_path: /probe
    scrape_interval: 10s
    static_configs:
      - targets: [kafka:9092]
        labels: { service: Kafka broker, tier: streaming, __param_module: tcp_connect }
      - targets: [kafka:9093]
        labels: { service: Kafka controller, tier: streaming, __param_module: tcp_connect }
      - targets: [http://connect:8083/connector-plugins]
        labels: { service: Kafka Connect, tier: streaming, __param_module: http_2xx }
      - targets: [http://connect:8083/connectors/students-sqlserver-cdc/status]
        labels: { service: Debezium connector, tier: streaming, __param_module: connector_running }
      - targets: [http://spark-streaming:4040/]
        labels: { service: Spark streaming, tier: streaming, __param_module: http_2xx }
      - targets: [http://kafka-ui:8080/]
        labels: { service: Kafka UI, tier: streaming, __param_module: http_2xx }
      - targets: [mssql:1433]
        labels: { service: SQL Server, tier: storage, __param_module: tcp_connect }
      - targets: [postgres:5432]
        labels: { service: PostgreSQL, tier: storage, __param_module: tcp_connect }
      - targets: [http://clickhouse:8123/ping]
        labels: { service: ClickHouse, tier: storage, __param_module: http_2xx }
      - targets: [http://airflow-webserver:8080/health]
        labels: { service: Airflow webserver, tier: batch, __param_module: http_2xx }
      - targets: [http://airflow-webserver:8080/health]
        labels: { service: Airflow scheduler, tier: batch, __param_module: airflow_scheduler }
      - targets: [http://grafana:3000/api/health]
        labels: { service: Grafana, tier: presentation, __param_module: http_2xx }
      - targets: [http://portal:8080/health]
        labels: { service: Students Portal, tier: presentation, __param_module: http_2xx }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
